name: Update Stock Code Index

# 每个交易日收盘后（北京时间 15:30）自动刷新 resources/stock_codes_list.json
# 客户端启动时从 main 分支 raw 地址拉取该文件，实现代码索引自动保鲜
on:
  schedule:
    - cron: "30 7 * * 1-5"  # UTC 07:30 = 北京时间 15:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install baostock

      - name: Build code index
        run: python tools/build_stock_code_index.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/stock_codes_list.json
          if git diff --cached --quiet; then
            echo "代码索引无变化，跳过提交"
          else
            git commit -m "chore: 自动更新股票代码索引"
            git push
          fi
